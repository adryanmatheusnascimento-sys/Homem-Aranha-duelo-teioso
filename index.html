<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HOMEM-ARANHA DUELO TEIOSO - TCG HERÓIS</title>
<style>
  :root {
    --bg-dark: #0f172a;
    --card-bg: #1e293b;
    --card-border: #e11d48;
    --gold: #fbbf24;
    --hp-color: #ef4444;
    --energia-color: #eab308;
    --shield-color: #38bdf8;
    --text: #f8fafc;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }

  body {
    background-color: var(--bg-dark);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    margin: 0;
    padding: 0;
    width: 100vw;
  }

  #status-bar {
    background: #090d16;
    padding: 8px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #e11d48;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    font-size: 0.85rem;
    flex-shrink: 0;
    width: 100%;
  }

  .lorde-info {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: bold;
  }

  .badge {
    padding: 2px 6px;
    border-radius: 12px;
    font-size: 0.8rem;
    background: rgba(255,255,255,0.08);
  }

  .hp-text { color: var(--hp-color); }
  .energia-text { color: var(--energia-color); }

  #tabuleiro {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 6px;
    background: radial-gradient(circle, #1e1b4b 0%, #090d16 100%);
    position: relative;
    gap: 4px;
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    overflow-y: auto;
  }

  .zona-campo {
    min-height: 130px;
    max-height: 160px;
    border: 2px dashed #334155;
    border-radius: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    background: rgba(15, 23, 42, 0.6);
    padding: 6px;
    overflow-x: auto;
    width: 100%;
  }

  #historico-log {
    text-align: center;
    font-size: 0.9rem;
    color: var(--gold);
    min-height: 28px;
    font-style: italic;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.4);
    border-radius: 6px;
    padding: 4px 8px;
    flex-shrink: 0;
    width: 100%;
  }

  #painel-inferior {
    background: #0f172a;
    border-top: 2px solid #334155;
    padding: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
  }

  #mao {
    display: flex;
    gap: 8px;
    justify-content: center;
    overflow-x: auto;
    width: 100%;
    max-width: 100%;
    padding-bottom: 4px;
  }

  .carta {
    width: 95px;
    height: 140px;
    background: var(--card-bg);
    border: 2px solid var(--card-border);
    border-radius: 8px;
    padding: 4px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    cursor: pointer;
    flex-shrink: 0;
    position: relative;
    box-shadow: 0 4px 8px rgba(0,0,0,0.6);
  }

  .carta.feitico {
    background: #1e1b4b;
    border-color: #6366f1;
  }

  .carta.exasto {
    opacity: 0.6;
    filter: grayscale(0.5);
  }

  .carta-custo {
    position: absolute;
    top: -6px;
    right: -6px;
    background: #eab308;
    color: #0f172a;
    border-radius: 50%;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 0.75rem;
    border: 2px solid #ffffff;
    z-index: 2;
  }

  .carta-img {
    width: 100%;
    height: 48px;
    object-fit: cover;
    border-radius: 4px;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .carta-nome {
    font-size: 0.62rem;
    font-weight: bold;
    text-align: center;
    margin-top: 2px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .carta-desc {
    font-size: 0.52rem;
    text-align: center;
    color: #94a3b8;
    margin: 1px 0;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .carta-stats {
    display: flex;
    justify-content: space-between;
    font-weight: bold;
    font-size: 0.58rem;
    background: rgba(0,0,0,0.5);
    padding: 2px 3px;
    border-radius: 4px;
  }

  #btn-passar {
    background: linear-gradient(135deg, #e11d48, #be123c);
    color: white;
    border: 1px solid #f43f5e;
    padding: 8px 20px;
    font-size: 0.9rem;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    box-shadow: 0 3px 6px rgba(0,0,0,0.4);
  }

  #btn-passar:disabled {
    background: #334155;
    border-color: #475569;
    color: #94a3b8;
    cursor: not-allowed;
  }

  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(15, 23, 42, 0.9);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }

  .modal-overlay.ativo {
    opacity: 1;
    pointer-events: auto;
  }

  .modal-card {
    background: #1e293b;
    border: 3px solid var(--gold);
    border-radius: 16px;
    padding: 25px;
    text-align: center;
    max-width: 380px;
    width: 90%;
    box-shadow: 0 0 30px rgba(251, 191, 36, 0.4);
    transform: scale(0.8);
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .modal-overlay.ativo .modal-card {
    transform: scale(1);
  }

  .modal-card h1 {
    font-size: 1.8rem;
    color: var(--gold);
    margin-bottom: 10px;
    text-transform: uppercase;
  }

  .modal-card p {
    font-size: 1rem;
    color: #94a3b8;
    margin-bottom: 20px;
    line-height: 1.4;
  }

  .modal-btn {
    background: linear-gradient(135deg, #22c55e, #16a34a);
    color: white;
    border: none;
    padding: 10px 24px;
    font-size: 1rem;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4);
  }
</style>
</head>

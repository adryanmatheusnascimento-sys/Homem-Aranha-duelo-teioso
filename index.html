<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HOMEM-ARANHA DUELO TEIOSO - TCG HERÓIS</title>
<style>
  :root {
    --bg-dark: #0f172a;
    --card-bg: #1e293b;
    --card-border: #e11d48;
    --gold: #fbbf24;
    --hp-color: #ef4444;
    --energia-color: #eab308;
    --shield-color: #38bdf8;
    --text: #f8fafc;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }

  /* Força a página inteira a ter um tamanho fixo proporcional e aplica o zoom global via scale */
  html, body {
    background-color: var(--bg-dark);
    color: var(--text);
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    margin: 0;
    padding: 0;
  }

  #app-container {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    transform: scale(0.67); /* Simula exatamente o zoom de 67% solicitado */
    transform-origin: top center;
    width: 149.25%; /* Compensa o scale para ocupar toda a largura proporcionalmente (100 / 0.67) */
    height: 149.25%; /* Compensa a altura proporcionalmente */
    position: absolute;
    top: 0;
    left: 0;
  }

  #status-bar {
    background: #090d16;
    padding: 6px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #e11d48;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    font-size: 0.85rem;
    flex-shrink: 0;
    height: 44px;
  }

  .lorde-info {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: bold;
  }

  .badge {
    padding: 2px 6px;
    border-radius: 8px;
    font-size: 0.8rem;
    background: rgba(255,255,255,0.08);
  }

  .hp-text { color: var(--hp-color); }
  .energia-text { color: var(--energia-color); }

  #tabuleiro {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 10px;
    background: radial-gradient(circle, #1e1b4b 0%, #090d16 100%);
    position: relative;
    gap: 8px;
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
    overflow: hidden;
  }

  .zona-campo {
    height: 110px;
    border: 2px dashed #334155;
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    background: rgba(15, 23, 42, 0.6);
    padding: 6px;
    overflow-x: auto;
    width: 100%;
    flex-shrink: 0;
  }

  #historico-log {
    text-align: center;
    font-size: 0.85rem;
    color: var(--gold);
    height: 32px;
    font-style: italic;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.4);
    border-radius: 6px;
    padding: 4px 8px;
    flex-shrink: 0;
    width: 100%;
  }

  #painel-inferior {
    background: #0f172a;
    border-top: 2px solid #334155;
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
    height: 155px;
  }

  #mao {
    display: flex;
    gap: 8px;
    justify-content: center;
    overflow-x: auto;
    width: 100%;
    height: 110px;
    align-items: center;
  }

  .carta {
    width: 85px;
    height: 110px;
    background: var(--card-bg);
    border: 2px solid var(--card-border);
    border-radius: 8px;
    padding: 3px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    cursor: pointer;
    flex-shrink: 0;
    position: relative;
    box-shadow: 0 3px 6px rgba(0,0,0,0.6);
  }

  .carta.feitico {
    background: #1e1b4b;
    border-color: #6366f1;
  }

  .carta.exasto {
    opacity: 0.6;
    filter: grayscale(0.5);
  }

  .carta-custo {
    position: absolute;
    top: -6px;
    right: -6px;
    background: #eab308;
    color: #0f172a;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 0.7rem;
    border: 1.5px solid #ffffff;
    z-index: 2;
  }

  .carta-img {
    width: 100%;
    height: 35px;
    object-fit: cover;
    border-radius: 4px;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .carta-nome {
    font-size: 0.55rem;
    font-weight: bold;
    text-align: center;
    margin-top: 1px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .carta-desc {
    font-size: 0.48rem;
    text-align: center;
    color: #94a3b8;
    margin: 1px 0;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .carta-stats {
    display: flex;
    justify-content: space-between;
    font-weight: bold;
    font-size: 0.52rem;
    background: rgba(0,0,0,0.5);
    padding: 2px 4px;
    border-radius: 4px;
  }

  #btn-passar {
    background: linear-gradient(135deg, #e11d48, #be123c);
    color: white;
    border: 1px solid #f43f5e;
    padding: 6px 20px;
    font-size: 0.85rem;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    box-shadow: 0 3px 6px rgba(0,0,0,0.4);
    height: 32px;
  }

  #btn-passar:disabled {
    background: #334155;
    border-color: #475569;
    color: #94a3b8;
    cursor: not-allowed;
  }

  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(15, 23, 42, 0.9);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }

  .modal-overlay.ativo {
    opacity: 1;
    pointer-events: auto;
  }

  .modal-card {
    background: #1e293b;
    border: 3px solid var(--gold);
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    max-width: 380px;
    width: 90%;
    box-shadow: 0 0 30px rgba(251, 191, 36, 0.4);
    transform: scale(0.8);
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .modal-overlay.ativo .modal-card {
    transform: scale(1);
  }

  .modal-card h1 {
    font-size: 1.6rem;
    color: var(--gold);
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .modal-card p {
    font-size: 0.95rem;
    color: #94a3b8;
    margin-bottom: 15px;
    line-height: 1.3;
  }

  .modal-btn {
    background: linear-gradient(135deg, #22c55e, #16a34a);
    color: white;
    border: none;
    padding: 8px 20px;
    font-size: 0.9rem;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(34, 197, 94, 0.4);
  }
</style>
</head>
